name: Relatar erro ou problema de teste
description: Informe um problema reproduzível na tradução ou nas ferramentas.
title: "[Bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Não anexe arquivos do jogo, executáveis, vídeos extraídos ou saves.
  - type: input
    id: build
    attributes:
      label: Versão do patch ou commit
      placeholder: "Ex.: versão/commit exibido no README"
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Versão/idioma da instalação do jogo
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Capítulo, local, menu ou habilidade
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Esperado e observado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Captura de tela ou observações
      description: Remova nomes de usuário e informações pessoais da imagem.
    validations:
      required: false

